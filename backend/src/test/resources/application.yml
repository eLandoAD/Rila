# Test-only configuration: in-memory H2, no Postgres or SMTP server needed.
spring:
  datasource:
    url: jdbc:h2:mem:securevault;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # nobody listens on this port on purpose: send() catches and logs, so the
  # tests neither deliver mail nor fail because of it
  mail:
    host: localhost
    port: 3025

jwt:
  secret: "test-only-secret-never-used-outside-the-test-suite"
  expiration: 3600000

app:
  storage:
    path: build/test-storage
  frontend-url: http://localhost:4200
  mail:
    from: test@securevault.test

logging:
  level:
    org.hibernate.SQL: warn
